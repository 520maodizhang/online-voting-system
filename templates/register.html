{% extends 'base.html' %}
{% block title %}注册 - 投票系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="mb-4 text-center">📝 注册</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" required placeholder="至少2个字符" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" required placeholder="至少4个字符">
                    </div>
                    <button type="submit" class="btn btn-success w-100">注册</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3 text-muted">
            已有账号？<a href="{{ url_for('login') }}">去登录</a>
        </p>
    </div>
</div>
{% endblock %}
